<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拾光 · 生活工作台</title>
<meta name="description" content="集成式生活工作台：记账理财、习惯健康、减脂健身、日程统筹、待买清单、书影音收藏，数据云端同步。">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #faf7f2; }
  iframe {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    border: none; display: block;
  }
  #fallback {
    display: none;
    position: fixed; inset: 0;
    background: #faf7f2;
    color: #5a4a3f;
    font-family: Georgia, "Songti SC", "SimSun", serif;
    text-align: center;
    padding: 2rem;
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  #fallback a { color: #b45f4d; }
</style>
</head>
<body>
<iframe id="app" src="https://workbuddy.link/p/4heyQlu52VkpotYfzFSZq8" title="拾光 · 生活工作台" allow="clipboard-write"></iframe>
<div id="fallback">
  <div style="font-size:1.4rem">拾光 · 生活工作台</div>
  <div>正在从云端加载工作台……<br>若长时间未显示，请<a href="https://workbuddy.link/p/4heyQlu52VkpotYfzFSZq8" target="_blank" rel="noopener">点此直接打开</a>。</div>
</div>
<script>
  var frame = document.getElementById('app');
  var fallback = document.getElementById('fallback');
  var loaded = false;
  frame.addEventListener('load', function () { loaded = true; });
  // 若 12 秒仍未加载成功，显示降级提示（不替换 iframe，仅覆盖提示层）
  setTimeout(function () {
    if (!loaded) {
      try {
        // 跨域无法检测内容，只要触发了 load 事件即视为可达
      } catch (e) {}
      fallback.style.display = 'flex';
      setTimeout(function () { fallback.style.display = 'none'; }, 8000);
    }
  }, 12000);
</script>
</body>
</html>
